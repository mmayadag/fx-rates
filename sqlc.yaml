version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/db/queries.sql"
    gen:
      go:
        out: "internal/db/sqlcgen"
        package: "sqlcgen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: false
        emit_prepared_queries: false
        emit_json_tags: false
        emit_db_tags: false
